name: Canvas background sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-background-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_SECRET: ${{ secrets.CANVAS_SYNC_CRON_SECRET }}
    steps:
      - name: Configuration notice
        if: env.SYNC_SECRET == ''
        run: echo "Canvas background sync is waiting for the CANVAS_SYNC_CRON_SECRET repository secret."

      - name: Sync due Canvas feeds
        if: env.SYNC_SECRET != ''
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2
          --request POST
          --header "Authorization: Bearer $SYNC_SECRET"
          https://www.myorderlyapp.com/api/canvas/background-sync
